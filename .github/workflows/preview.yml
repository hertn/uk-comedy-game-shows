name: Preview reality rules

on:
  workflow_dispatch:
    inputs:
      names:
        description: Semicolon-separated show names to inspect
        required: false
        default: ''

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          PROBE: ${{ inputs.names }}
        run: python3 tools/discover.py --preview-reality
