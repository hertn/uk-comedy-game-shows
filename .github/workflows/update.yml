name: Find new shows

on:
  schedule:
    - cron: "0 7 * * 1"   # Mondays, 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find candidates
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 tools/discover.py
      - name: Rebuild catalog
        run: python3 tools/build.py
      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name hertn
          git config user.email 20706648+hertn@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Add new show candidates"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
