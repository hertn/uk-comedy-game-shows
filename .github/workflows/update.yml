name: Find new shows

on:
  schedule:
    - cron: "0 7 * * 1"   # Mondays, 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Find new shows
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 tools/discover.py
      - name: Rebuild catalog
        run: python3 tools/build.py
      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          date -u +%F > last-run.txt   # keeps the repo active so GitHub never pauses this schedule
          git config user.name hertn
          git config user.email 20706648+hertn@users.noreply.github.com
          git add -A
          git commit -m "Weekly update" || exit 0
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
